[project]
name = "premsight-database"
version = "0.1.0"
description = "PremSight PostgreSQL migrations, seeds, and schema tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
premsight-db = "premsight_database.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premsight_database"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"
"seeds" = "seeds"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
