services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-premsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premsight}
      POSTGRES_DB: ${POSTGRES_DB:-premsight}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-premsight} -d ${POSTGRES_DB:-premsight}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - premsight

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - premsight

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: ${API_HOST:-0.0.0.0}
      PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://premsight:premsight@postgres:5432/premsight}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PREDICTION_ENGINE_URL: ${PREDICTION_ENGINE_URL:-http://prediction-engine:8001}
      CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-premsight-auth-secret}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/v1/auth/google/callback}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prediction-engine:
        condition: service_started
    networks:
      - premsight

  prediction-engine:
    build:
      context: ./services/prediction-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: ${PREDICTION_ENGINE_HOST:-0.0.0.0}
      PORT: ${PREDICTION_ENGINE_PORT:-8001}
    ports:
      - '${PREDICTION_ENGINE_PORT:-8001}:8001'
    networks:
      - premsight

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
      additional_contexts:
        database: ./packages/database
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: ${INGESTION_HOST:-0.0.0.0}
      PORT: ${INGESTION_PORT:-8002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-premsight}:${POSTGRES_PASSWORD:-premsight}@postgres:5432/${POSTGRES_DB:-premsight}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      SCHEDULE_INTERVAL_SECONDS: ${SCHEDULE_INTERVAL_SECONDS:-900}
      SCHEDULE_RUN_ON_STARTUP: ${SCHEDULE_RUN_ON_STARTUP:-true}
      INGEST_COMPETITION: ${INGEST_COMPETITION:-PL}
    ports:
      - '${INGESTION_PORT:-8002}:8002'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - premsight

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      CI: 'true'
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_PREDICTION_ENGINE_URL: ${NEXT_PUBLIC_PREDICTION_ENGINE_URL:-http://localhost:8001}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - premsight

volumes:
  postgres_data:

networks:
  premsight:
    driver: bridge
